name: AITA Full-Stack CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. BACKEND CI
  # =========================================================================
  backend-ci:
    name: Backend CI (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aita-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: aita-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Compilation & Build
        run: npm run build

  # =========================================================================
  # 2. FRONTEND CI
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Structure, Tests, Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aita-fontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: aita-fontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Architecture & Route Structure
        run: npm run check:structure

      - name: Run Automated Unit Tests
        run: npm test

      - name: Next.js Typegen & TypeScript Check
        run: npm run typecheck

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: /api
          API_PROXY_TARGET: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # =========================================================================
  # 3. DOCKER BUILD VERIFICATION
  # =========================================================================
  docker-build:
    name: Docker Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./aita-backend
          file: ./aita-backend/Dockerfile
          push: false
          tags: aita-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./aita-fontend
          file: ./aita-fontend/Dockerfile
          push: false
          tags: aita-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
